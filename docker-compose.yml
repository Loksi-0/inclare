services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
      build:
        context: .
        dockerfile: apps/backend/Dockerfile
      command: pnpm --filter=@repo/db exec prisma migrate deploy
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      args: 
        - NODE_ENV=${NODE_ENV}
    container_name: inclare-backend
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    env_file:
      - ./.env
    volumes:
      - ./apps/backend/uploads:/inclare/apps/backend/uploads
    ports:
      - "5005:${API_PORT}"
    depends_on:
      migration:
          condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      args:
        - API_URL=${API_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - IGNORE_BUILD_TYPE_ERRORS=${IGNORE_BUILD_TYPE_ERRORS}
        - IMAGE_COMPRESSION=${IMAGE_COMPRESSION}
        - UNOPTIMIZE_IMAGES=${UNOPTIMIZE_IMAGES}
        - NODE_ENV=${NODE_ENV}
    container_name: inclare-frontend
    ports:
      - "3005:80"
    env_file:
      - ./.env
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: